<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TOWER DEFENSE</title>
    <!-- 引入 Tailwind CSS 確保排版美觀 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 16px;
        }
        canvas {
            background-color: #1a202c;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header class="text-center mb-4">
            <h1 class="text-3xl font-extrabold text-emerald-400 tracking-wider">CYBER TOWER DEFENSE</h1>
            <p class="text-slate-400 text-sm mt-1">點擊右側面板選擇防禦塔，再點擊地圖上的空地進行建造！阻擋敵人入侵。</p>
        </header>

        <div class="flex flex-col lg:flex-row gap-6 items-center bg-slate-800 p-6 rounded-2xl border border-slate-700">
            <div class="relative">
                <canvas id="gameCanvas" width="800" height="500" class="rounded-lg cursor-crosshair"></canvas>
                <div id="gameOverScreen" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center rounded-lg hidden">
                    <h2 id="gameOverTitle" class="text-4xl font-black text-red-500 mb-2">GAME OVER</h2>
                    <p id="gameOverDesc" class="text-slate-300 mb-4">你撐過了 <span id="finalWave">0</span> 波攻擊</p>
                    <button onclick="resetGame()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-6 py-2 rounded-lg transition">重新挑戰</button>
                </div>
            </div>

            <div class="w-full lg:w-64 flex flex-col justify-between gap-4 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 h-[500px]">
                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <div class="text-xs text-slate-400">生命值 (HP)</div>
                        <div id="statHp" class="text-xl font-bold text-red-400">20</div>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <div class="text-xs text-slate-400">金幣 (GOLD)</div>
                        <div id="statGold" class="text-xl font-bold text-amber-400">300</div>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 col-span-2">
                        <div class="text-xs text-slate-400">當前波次</div>
                        <div id="statWave" class="text-xl font-bold text-sky-400">第 1 波 / 共 10 波</div>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">選擇防禦塔</span>
                    <button onclick="selectTowerType('machineGun')" id="btn-machineGun" class="tower-btn flex justify-between items-center p-3 rounded-lg bg-slate-800 border-2 border-emerald-500 transition text-left">
                        <div>
                            <div class="font-bold text-sm text-emerald-300">機槍塔</div>
                            <div class="text-xs text-slate-400">攻速快 / 單體傷害</div>
                        </div>
                        <span class="text-amber-400 font-bold text-sm">$100</span>
                    </button>
                    <button onclick="selectTowerType('cannon')" id="btn-cannon" class="tower-btn flex justify-between items-center p-3 rounded-lg bg-slate-800 border-2 border-slate-700 transition text-left">
                        <div>
                            <div class="font-bold text-sm text-sky-300">砲塔</div>
                            <div class="text-xs text-slate-400">範圍轟炸 / 高傷害</div>
                        </div>
                        <span class="text-amber-400 font-bold text-sm">$175</span>
                    </button>
                    <button onclick="selectTowerType('slow')" id="btn-slow" class="tower-btn flex justify-between items-center p-3 rounded-lg bg-slate-800 border-2 border-slate-700 transition text-left">
                        <div>
                            <div class="font-bold text-sm text-indigo-300">冰凍塔</div>
                            <div class="text-xs text-slate-400">大範圍緩速敵人</div>
                        </div>
                        <span class="text-amber-400 font-bold text-sm">$125</span>
                    </button>
                </div>

                <button id="startWaveBtn" onclick="startNextWave()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-extrabold py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">
                    開始下一波！
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let hp = 20;
        let gold = 300;
        let wave = 0;
        let maxWaves = 10;
        let gameActive = true;
        let waveInProgress = false;
        let selectedTowerType = 'machineGun';

        const path = [
            { x: 0, y: 100 },
            { x: 200, y: 100 },
            { x: 200, y: 350 },
            { x: 500, y: 350 },
            { x: 500, y: 150 },
            { x: 700, y: 150 },
            { x: 700, y: 420 },
            { x: 800, y: 420 }
        ];

        let towers = [];
        let enemies = [];
        let projectiles = [];
        let explosions = [];

        const towerConfigs = {
            machineGun: { cost: 100, range: 120, damage: 12, cooldown: 25, color: '#10b981', name: '機槍塔' },
            cannon: { cost: 175, range: 150, damage: 45, cooldown: 90, color: '#0ea5e9', splash: 70, name: '砲塔' },
            slow: { cost: 125, range: 100, damage: 2, cooldown: 40, slowEffect: 0.5, color: '#6366f1', name: '冰凍塔' }
        };

        class Enemy {
            constructor(waveNum) {
                this.x = path[0].x;
                this.y = path[0].y;
                this.waypointIndex = 0;
                this.maxHp = 50 + waveNum * 25;
                this.hp = this.maxHp;
                this.speed = 1.8 + waveNum * 0.1;
                this.baseSpeed = this.speed;
                this.reward = 12 + waveNum * 2;
                this.radius = 12;
                this.slowTimer = 0;
            }

            update() {
                if (this.slowTimer > 0) {
                    this.speed = this.baseSpeed * 0.5;
                    this.slowTimer--;
                } else {
                    this.speed = this.baseSpeed;
                }

                const target = path[this.waypointIndex + 1];
                if (!target) return;

                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.x = target.x;
                    this.y = target.y;
                    this.waypointIndex++;
                    if (this.waypointIndex >= path.length - 1) {
                        hp--;
                        updateStats();
                        if (hp <= 0) triggerGameOver(false);
                        return 'reached_end';
                    }
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
                return 'moving';
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.slowTimer > 0 ? '#818cf8' : '#f43f5e';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffe4e6';
                ctx.stroke();

                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(this.x - 15, this.y - 22, 30, 4);
                ctx.fillStyle = '#10b981';
                ctx.fillRect(this.x - 15, this.y - 22, 30 * (this.hp / this.maxHp), 4);
            }
        }

        class Tower {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.config = towerConfigs[type];
                this.cooldownTimer = 0;
                this.level = 1;
            }

            update() {
                if (this.cooldownTimer > 0) this.cooldownTimer--;

                if (this.cooldownTimer === 0) {
                    let target = null;
                    let maxDist = -1;

                    for (let enemy of enemies) {
                        const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                        if (dist <= this.config.range) {
                            const score = enemy.waypointIndex * 1000 - dist;
                            if (score > maxDist) {
                                maxDist = score;
                                target = enemy;
                            }
                        }
                    }

                    if (target) {
                        this.shoot(target);
                        this.cooldownTimer = this.config.cooldown;
                    }
                }
            }

            shoot(target) {
                const dmg = this.config.damage * (1 + (this.level - 1) * 0.4);
                if (this.type === 'slow') {
                    target.slowTimer = 60;
                    target.hp -= dmg;
                } else if (this.config.splash) {
                    projectiles.push(new Projectile(this.x, this.y, target, dmg, this.config.splash));
                } else {
                    projectiles.push(new Projectile(this.x, this.y, target, dmg, 0));
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.config.range, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x, this.y, 16, 0, Math.PI * 2);
                ctx.fillStyle = this.config.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                if (this.level > 1) {
                    ctx.fillStyle = '#f59e0b';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.fillText(`Lv.${this.level}`, this.x - 12, this.y - 20);
                }
            }
        }

        class Projectile {
            constructor(x, y, target, damage, splash) {
                this.x = x;
                this.y = y;
                this.target = target;
                this.damage = damage;
                this.splash = splash;
                this.speed = 7;
            }

            update() {
                if (!this.target || this.target.hp <= 0) return true;

                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    if (this.splash > 0) {
                        explosions.push(new Explosion(this.target.x, this.target.y, this.splash));
                        for (let enemy of enemies) {
                            if (Math.hypot(enemy.x - this.target.x, enemy.y - this.target.y) <= this.splash) {
                                enemy.hp -= this.damage;
                            }
                        }
                    } else {
                        this.target.hp -= this.damage;
                    }
                    return true;
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
                return false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fbbf24';
                ctx.fill();
            }
        }

        class Explosion {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.alpha = 0.6;
            }
            update() {
                this.alpha -= 0.05;
                return this.alpha <= 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(244, 63, 94, ${this.alpha})`;
                ctx.fill();
            }
        }

        canvas.addEventListener('click', (e) => {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let tower of towers) {
                if (Math.hypot(tower.x - clickX, tower.y - clickY) < 20) {
                    const upgradeCost = Math.floor(tower.config.cost * 0.8 * tower.level);
                    if (gold >= upgradeCost && tower.level < 3) {
                        gold -= upgradeCost;
                        tower.level++;
                        updateStats();
                    }
                    return;
                }
            }

            for (let i = 0; i < path.length - 1; i++) {
                const p1 = path[i];
                const p2 = path[i+1];
                if (isPointNearSegment(clickX, clickY, p1.x, p1.y, p2.x, p2.y, 28)) {
                    return;
                }
            }

            const cost = towerConfigs[selectedTowerType].cost;
            if (gold >= cost) {
                gold -= cost;
                towers.push(new Tower(clickX, clickY, selectedTowerType));
                updateStats();
            }
        });

        function isPointNearSegment(px, py, x1, y1, x2, y2, tolerance) {
            const l2 = (x2 - x1)**2 + (y2 - y1)**2;
            if (l2 === 0) return Math.hypot(px - x1, py - y1) < tolerance;
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            const projX = x1 + t * (x2 - x1);
            const projY = y1 + t * (y2 - y1);
            return Math.hypot(px - projX, projY - py) < tolerance;
        }

        function selectTowerType(type) {
            selectedTowerType = type;
            document.querySelectorAll('.tower-btn').forEach(btn => {
                btn.classList.remove('border-emerald-500');
                btn.classList.add('border-slate-700');
            });
            document.getElementById(`btn-${type}`).classList.remove('border-slate-700');
            document.getElementById(`btn-${type}`).classList.add('border-emerald-500');
        }

        function updateStats() {
            document.getElementById('statHp').innerText = hp;
            document.getElementById('statGold').innerText = gold;
            document.getElementById('statWave').innerText = `第 ${wave} 波 / 共 ${maxWaves} 波`;
        }

        let spawnCounter = 0;
        let enemiesToSpawn = 0;

        function startNextWave() {
            if (waveInProgress || !gameActive) return;
            if (wave >= maxWaves) return;

            wave++;
            waveInProgress = true;
            document.getElementById('startWaveBtn').disabled = true;
            document.getElementById('startWaveBtn').classList.add('opacity-50', 'cursor-not-allowed');
            updateStats();

            enemiesToSpawn = 6 + wave * 3;
            spawnCounter = 0;
        }

        function triggerGameOver(isWin) {
            gameActive = false;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            const title = document.getElementById('gameOverTitle');
            if (isWin) {
                title.innerText = "VICTORY!";
                title.className = "text-4xl font-black text-emerald-400 mb-2";
            } else {
                title.innerText = "GAME OVER";
                title.className = "text-4xl font-black text-red-500 mb-2";
            }
            document.getElementById('finalWave').innerText = wave;
        }

        function resetGame() {
            hp = 20;
            gold = 300;
            wave = 0;
            gameActive = true;
            waveInProgress = false;
            towers = [];
            enemies = [];
            projectiles = [];
            explosions = [];
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('startWaveBtn').disabled = false;
            document.getElementById('startWaveBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            updateStats();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 36;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 4;
            ctx.stroke();

            if (waveInProgress && enemiesToSpawn > 0) {
                spawnCounter++;
                if (spawnCounter > 35) {
                    enemies.push(new Enemy(wave));
                    enemiesToSpawn--;
                    spawnCounter = 0;
                }
            }

            for (let tower of towers) {
                tower.update();
                tower.draw();
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const status = enemies[i].update();
                if (status === 'reached_end') {
                    enemies.splice(i, 1);
                } else if (enemies[i].hp <= 0) {
                    gold += enemies[i].reward;
                    updateStats();
                    enemies.splice(i, 1);
                } else {
                    enemies[i].draw();
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                if (projectiles[i].update()) {
                    projectiles.splice(i, 1);
                } else {
                    projectiles[i].draw();
                }
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                if (explosions[i].update()) {
                    explosions.splice(i, 1);
                } else {
                    explosions[i].draw();
                }
            }

            if (waveInProgress && enemiesToSpawn === 0 && enemies.length === 0) {
                waveInProgress = false;
                document.getElementById('startWaveBtn').disabled = false;
                document.getElementById('startWaveBtn').classList.remove('opacity-50', 'cursor-not-allowed');
                
                if (wave >= maxWaves) {
                    triggerGameOver(true);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        updateStats();
        gameLoop();
    </script>
</body>
</html>
